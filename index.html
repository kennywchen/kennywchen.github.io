<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS180 Project 0 - Image Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="title">CS180 Project 0</h1>
            <p class="subtitle">By Kenny Chen</p>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <!-- Person Images Section -->
            <section class="section" id="person-images">
                <h2 class="section-title">Person Images</h2>
                <div class="image-grid">
                    <div class="image-card">
                        <img src="assets/IMG_8815.jpeg" alt="Person 1" class="image">
                        <div class="image-overlay">
                            <p class="image-caption">Zoomed-In</p>
                        </div>
                    </div>
                    <div class="image-card">
                        <img src="assets/IMG_8822.jpeg" alt="Person 2" class="image">
                        <div class="image-overlay">
                            <p class="image-caption">Zoomed-Out</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Street Images Section -->
            <section class="section" id="street-images">
                <h2 class="section-title">Street Images</h2>
                <div class="image-grid">
                    <div class="image-card">
                        <img src="assets/IMG_8826.jpeg" alt="Street 1" class="image">
                        <div class="image-overlay">
                            <p class="image-caption">Zoomed-In</p>
                        </div>
                    </div>
                    <div class="image-card">
                        <img src="assets/IMG_8828.jpeg" alt="Street 2" class="image">
                        <div class="image-overlay">
                            <p class="image-caption">Zoomed-Out</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Dolly Effect Section -->
            <section class="section" id="dolly-effect">
                <h2 class="section-title">Dolly Effect</h2>
                <div class="gif-container">
                    <img src="assets/a4ta42.gif" alt="Dolly Effect Demo" class="gif">
                </div>
            </section>
        </div>
    </main>
</body>
</html>
